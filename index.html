<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>달밤 채집단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 한 화면 앱. 위 띠, 가운데 화면, 아래 탭. 교실 게시판에 붙이는 공판화 인쇄물 같은 한 가지 세계로 고정한다. */
:root{
  color-scheme:light;
  --ink:#20246b; --ink-soft:#5a5f9e; --paper:#fbfdf3; --field:#e6f4d3; --line:#c9d5b4;
  --sun:#ffd23f; --pink:#ff7d9c; --sky:#86d6f7; --mint:#7fe0bb; --violet:#c3a6ff; --danger:#c22750; --ok:#0f7a55;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --pen:"Gowun Batang","AppleMyungjo","Batang",serif;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--body);overflow:hidden}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
header{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header h1{font-size:21px;color:var(--sun);white-space:nowrap}
#tally{margin-left:auto;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
#tally b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--sun)}
main{min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto}
.scroll{max-width:820px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
#view-map{overflow:hidden;background:var(--field)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;background:var(--ink);color:var(--paper);padding:5px 14px;border-radius:6px;font-size:14px;pointer-events:none;text-align:center}
#nestBtn{background:var(--sun);color:var(--ink);border:0;border-radius:4px;padding:4px 10px;font-family:var(--display);font-size:15px;white-space:nowrap}
nav{display:grid;grid-template-columns:repeat(var(--tabs,4),1fr);background:var(--paper);border-top:3px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{background:none;border:0;padding:11px 2px;font-family:var(--display);font-size:16px;color:var(--ink-soft)}
nav button[aria-current="page"]{background:var(--ink);color:var(--sun)}
.lead{color:var(--ink-soft);max-width:60ch}
.btn{background:var(--sun);border:2px solid var(--ink);border-radius:6px;padding:9px 16px;box-shadow:3px 3px 0 var(--ink);font-family:var(--display);font-size:16px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--paper)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip.used{background:var(--mint);font-weight:700}
.chip{text-align:left;max-width:100%}
textarea.draft{font:17px/2em var(--pen);min-height:calc(2em*5);background-image:repeating-linear-gradient(transparent,transparent calc(2em - 1px),var(--line) calc(2em - 1px),var(--line) 2em);background-attachment:local;padding-block:0}
.tag{display:inline-block;font-size:12.5px;letter-spacing:.02em;padding:0 7px;border:1.5px solid var(--ink);border-radius:4px;background:var(--pos,var(--paper));white-space:nowrap}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.spec{background:var(--paper);border:2px solid var(--ink);padding:10px;display:grid;justify-items:center;gap:3px;text-align:center;position:relative}
.spec.hit{cursor:pointer}
.spec.miss{border-style:dashed;border-color:var(--ink-soft);color:var(--ink-soft)}
.spec img{width:72px;height:72px}
.spec b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.3}
.spec small{font-size:12.5px}
.stamp{position:absolute;top:6px;right:6px;font-size:11.5px;background:var(--pink);border:1.5px solid var(--ink);padding:0 5px;transform:rotate(5deg)}
.stars{color:var(--ink);letter-spacing:1px;font-size:12.5px}
label{font-size:14px;color:var(--ink-soft);display:grid;gap:4px}
input[type=text],textarea,select{width:100%;background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:8px 10px;color:var(--ink)}
textarea#draft{min-height:200px;font:17px/2 var(--pen);background-image:repeating-linear-gradient(transparent,transparent calc(2em - 1px),var(--line) calc(2em - 1px),var(--line) 2em);background-attachment:local;line-height:2em;padding-top:0}
.brief{background:var(--ink);color:var(--paper);padding:14px 16px;display:grid;gap:4px}
.brief h3{color:var(--sun);font-size:20px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:15px}
.checks li::before{content:"○ ";color:var(--ink-soft)}
.checks li.ok{color:var(--ok);font-weight:700}
.checks li.ok::before{content:"● ";color:var(--ok)}
.checks li.bad{color:var(--danger);font-weight:700}
.checks li.bad::before{content:"× ";color:var(--danger)}
.work{background:var(--paper);border:2px solid var(--ink);padding:14px 16px;display:grid;gap:6px}
.work p{font:17px/1.9 var(--pen);white-space:pre-wrap;overflow-wrap:anywhere}
.work mark{background:var(--sun);color:inherit;padding:0 2px}
.work footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);align-items:center}
.link{background:none;border:0;padding:0;color:var(--danger);text-decoration:underline;font-size:13.5px}
.meter{height:16px;border:2px solid var(--ink);background:var(--paper)}
.meter i{display:block;height:100%;background:var(--pink)}
.note{border:2px dashed var(--ink-soft);padding:10px 12px;font-size:15px;color:var(--ink)}
table{border-collapse:collapse;width:100%}
th,td{border:1.5px solid var(--ink);padding:5px 10px;text-align:left}
td.code{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.08em}
ol.steps{margin:0;padding-left:1.4em;display:grid;gap:6px;max-width:65ch}
section{display:grid;gap:10px;min-width:0}
section>h2{font-size:21px}
.over{position:fixed;inset:0;z-index:20;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
.over.light{background:rgba(32,36,107,.72)}
.panel{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--sun);padding:18px;width:min(440px,100%);display:grid;gap:10px;text-align:left}
.panel h2{font-size:24px}
#ring{width:min(320px,80vw,44vh);height:min(320px,80vw,44vh);flex:none}
#catchTop{color:var(--sun);font-family:var(--display);font-size:clamp(30px,8vw,42px);line-height:1.2}
#catchSub{max-width:42ch;min-height:1.6em}
.opts{display:grid;gap:8px;width:min(440px,100%)}
.opts button{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:10px 12px;text-align:left;box-shadow:3px 3px 0 var(--sun)}
.opts button.right{background:var(--mint)}
.opts button.wrong{background:var(--pink)}
#toast{position:fixed;z-index:30;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--sun);color:var(--ink);border:2px solid var(--ink);padding:7px 14px;max-width:calc(100% - 32px);width:max-content;font-size:15px;text-align:center}
@media (prefers-reduced-motion:no-preference){.spec.hit{transition:transform .12s}.spec.hit:hover{transform:translateY(-3px)}}
[hidden]{display:none!important}
body{margin:0}
#view-map{background:#14173f}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#ar{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{z-index:5;bottom:96px;background:rgba(32,36,107,.86)}
#radar{position:absolute;left:12px;bottom:12px;width:72px;height:72px;z-index:5;pointer-events:none}
#count{position:absolute;right:12px;bottom:12px;z-index:5;background:rgba(32,36,107,.86);color:var(--paper);padding:5px 10px;border-radius:6px;font-size:14px}
.over.cam{background:rgba(20,23,63,.42);position:fixed}
.over.cam #catchTop{text-shadow:0 2px 0 var(--ink)}
.over.cam #catchSub{background:rgba(32,36,107,.86);padding:3px 10px;border-radius:6px}
#qr svg{width:220px;height:220px;display:block}
input[type=checkbox]{width:20px;height:20px}
.inline{display:flex;gap:8px;align-items:center;color:var(--ink)}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head><body>
<div id="app">
  <header>
    <h1>달밤 채집단</h1>
    <div id="tally" aria-live="polite"></div>
  </header>
  <main>
    <div class="view" id="view-map">
      <video id="cam" playsinline muted autoplay></video>
      <canvas id="ar" aria-label="카메라 화면. 낱말이를 누르면 채집합니다."></canvas>
      <canvas id="radar" width="144" height="144" aria-hidden="true"></canvas>
      <div id="count"></div>
      <div id="hint">휴대폰을 천천히 돌려 보세요</div>
    </div>
    <div class="view" id="view-dex" hidden></div>
    <div class="view" id="view-write" hidden></div>
    <div class="view" id="view-wall" hidden></div>
    <div class="view" id="view-teacher" hidden></div>
  </main>
  <nav id="tabs"></nav>
</div>
<div id="overlay" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
"use strict";
/* ---------- 낱말 자료: 낱말|품사|뜻|예문|희귀도|활용형(선택) ---------- */
const RAW=`#meet|첫 만남
n|문안|사대문 안, 곧 서울 도성의 안쪽|“나도 가끔 문안엔 다니지만”처럼 서울 중심을 가리킨다.
n|대처|사람이 많이 살고 번화한 도회지|‘나’는 대처와 시골의 못난이를 견주어 말한다.
n|손|다른 곳에서 찾아온 사람, 곧 손님|동리에 처음 들어서는 손에게 시골의 정취를 돋워 준다.
n|합비|일본식 겉옷. 여기서는 신문 배달부의 옷|황수건은 합비를 입지 않고 신문을 들고 왔다.
n|업|살아가려고 늘 하는 일, 직업|황수건은 집 찾은 일을 제 업이라고 말한다.
n|행세|세상에서 사람답게 처신하며 지내는 일|대처에서는 못난이들이 거리에 나와 행세하지 못한다고 한다.
n|우둔하다|어리석고 둔하다|‘나’는 황수건의 얼굴을 우둔하다고 말한다.|우둔
n|천진스럽다|꾸밈이나 거짓 없이 순수한 데가 있다|시골 사람의 눈을 천진스럽다고 그린다.|천진
n|순박하다|꾸밈이 없고 인정이 두텁다|순박한 시골의 정취를 돋워 준다.|순박
n|히죽거리다|만족스러운 듯 슬쩍슬쩍 웃다|큰 눈과 큰 입이 함께 히죽거린다.|히죽
a|성북동|‘나’가 이사 온, 서울 문밖의 시골 같은 동네|성북동의 산과 물보다 황수건이 더 시골답게 느껴진 까닭은 무엇일까요?
a|못난이|‘나’가 황수건을 처음 보고 붙인 말|‘나’가 쓰는 못난이라는 말에는 낮춤과 정이 함께 있을까요?
s|여기도 정말 시골이로군!|이사 온 ‘나’가 황수건을 만난 날 밤 혼자 한 말|이 말은 불평일까요, 반가움일까요?
s|우둔하면서도 천진스런 눈|시골에서 만나는 못난이의 눈을 그린 말|어리석음과 순수함은 어떻게 한 눈에 함께 있을 수 있을까요?
s|이게 제 업인뎁쇼|집을 찾느라 수고했다는 말에 황수건이 한 대답|보조배달인 그가 이 일을 업이라 부르는 모습에서 무엇이 느껴지나요?
#dream|원배달의 꿈
n|기상천외|보통 사람은 생각하지 못할 만큼 기발하고 엉뚱함|황수건의 이야깃거리는 기상천외하다.
n|경난|어려운 일을 겪음|황수건은 경난이 없어 거기까지는 바랄 생각도 못 했다고 한다.
n|취재|이야깃거리나 글감을 찾아 얻음|그가 얘깃거리를 취재하는 범위는 넓다.
n|반편|지능이 보통 사람보다 모자란다고 낮잡아 이르는 말. 오늘날 쓰면 안 되는 차별 표현|새 배달부와 집안사람들이 황수건을 이렇게 부른다.
n|야박하다|인정이 없고 쌀쌀맞다|‘나’는 세상의 야박함을 원망스러워한다.|야박
a|원배달|월급을 받고 배달복과 방울을 갖춘 정식 배달부|황수건의 평생 소원이 왜 하필 원배달일까요?
a|보조배달|원배달에게 몇십 부를 떼어 받아 돌리고 삼 원쯤 받는 일|사람들 사이에서 황수건의 자리는 어디쯤일까요?
a|방울|원배달이 차고 다니는 물건. 황수건이 가장 부러워한 것|방울 소리와 함께 들어온 사람이 황수건이 아니었을 때 ‘나’의 마음은 어땠을까요?
s|아무것도 아닌 것을 가지고 열심스럽게 이야기하는 것이|‘나’가 황수건과 이야기하기를 좋아한 까닭을 말하는 대목|쓸모없어 보이는 대화가 왜 ‘나’를 가볍게 해 주었을까요?
s|무어든지 끝을 바라고 붙들어야 한다|원배달이 된다며 신이 난 황수건이 ‘나’에게 일러 준 말|뒷일을 알고 다시 읽으면 이 말이 어떻게 들리나요?
s|그까짓 반편을 어딜 맡깁니까?|새 배달부가 황수건의 소식을 묻자 웃으며 한 말|이 한마디에 세상이 황수건을 보는 눈이 어떻게 담겨 있나요?
s|세상의 야박함이 원망스럽기도 하였다|황수건이 밀려난 뒤 ‘나’가 느낀 마음|‘나’는 황수건을 위해 무엇을 할 수 있었을까요?
#tale|노랑수건 이야기
n|급사|학교나 관청에서 잔심부름을 하던 사람|황수건은 삼산학교 급사로 있었다.
n|시학관|일제강점기에 학교 교육을 살피러 다니던 관리|황수건은 시학관을 앉혀 놓고 일본말을 연습했다.
n|만담|익살스럽고 재미있게 세상을 이야기하는 말재주|그는 손님과 마주 앉아 자기류의 만담에 빠진다.
n|일화|세상에 널리 알려지지 않은 재미있는 이야기|그에겐 우스운 일화가 한두 가지가 아니다.
n|삼매|한 가지 일에 온 정신을 쏟는 상태|자기류의 만담 삼매로 빠진다.
n|그예|마지막에 가서는 기어이|그 버릇을 못 고쳐 그예 쫓겨 나왔다.
n|고스카이|학교나 관청의 잡일을 하던 사람을 이르던 일본말. 소설은 ‘용인’으로 풀었다|돈만 있으면 고스카이 노릇은 안 한다고 말한다.
a|노랑수건|황수건의 이름을 두고 아이들이 붙인 별명|놀림받는 별명을 자랑하는 황수건을 어떻게 봐야 할까요?
a|삼산학교|황수건이 급사로 있다가 쫓겨난 곳이자 다시 돌아가고 싶어 한 곳|그는 왜 쫓겨난 학교 곁을 떠나지 못할까요?
s|너의 색시 달아난다|황수건이 제일 무서워했다는 말|장난으로 들린 이 말이 뒤에서 어떻게 현실이 되나요?
s|오십 분 만에 치는 종을 이십 분 만에|색시가 달아날까 걱정한 황수건이 종을 앞당겨 친 일|우스운 일화 속에 어떤 마음이 숨어 있나요?
#melon|삼 원과 참외

function beast(c,x,y,r,w,t=0,o={}){
  const h=hash(w.word)%628/100,bob=reduced?0:Math.sin(t*2.4+h)*r*.07;y+=bob;

  if(w.rare===3&&!o.plain){c.save();c.setLineDash([r*.18,r*.18]);c.lineDashOffset=-t*r*.5;c.strokeStyle="#ffb300";c.lineWidth=Math.max(2.5,r*.1);c.beginPath();c.arc(x,y,r*1.4,0,7);c.stroke();c.restore()}
  c.beginPath();
  for(let i=0;i<N;i++){const a=i/N*Math.PI*2,R=r*f(a,i);c[i?"lineTo":"moveTo"](x+Math.cos(a)*R,y+Math.sin(a)*R)}
  c.closePath();c.fillStyle=o.hidden?"#20246b":POS[w.pos].c;c.fill();c.stroke();
  if(o.hidden){c.fillStyle="#ffd23f";c.font=`${r*1}px "Black Han Sans",sans-serif`;c.textAlign="center";c.textBaseline="middle";c.fillText("?",x,y+r*.05);return}
  const ew=r*(.26+(h%1)*.08),blink=!reduced&&(t+h)%4<.12;
  for(const s of[-1,1]){
    c.fillStyle="#fff";c.beginPath();c.arc(x+s*ew,y-r*.1,r*.19,0,7);c.fill();c.stroke();
    c.fillStyle="#20246b";c.beginPath();c.arc(x+s*ew,y-r*.1,blink?r*.03:r*.09,0,7);c.fill();
  }
  c.beginPath();c.arc(x,y+r*.2,r*.17,.15*Math.PI,.85*Math.PI);c.stroke();
  if(o.bloom){c.fillStyle="#ff7d9c";c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,R=i%2?r*.13:r*.3;c[i?"lineTo":"moveTo"](x+Math.cos(a)*R,y-r*1.08+Math.sin(a)*R)}c.closePath();c.fill();c.stroke()}
}

  ov.innerHTML=`<div class="panel"><h2>《달밤》을 채집해요</h2><p>카메라로 교실을 비추고 휴대폰을 위아래, 좌우로 돌려 보세요. 소설 속 낱말과 키워드, 구절이 숨어 있어요.</p><p class="lead">자리에서 할 수 있어요. 카메라 영상은 화면에만 보이고 저장되거나 전송되지 않습니다.</p><div class="row"><button class="btn" id="go" type="button">카메라 켜고 시작</button></div></div>`;
  $("#go").onclick=startAR;

/* ---------- 채집 ---------- */
const ov=$("#overlay");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startCatch(m){
  const w=m.w,others=shuffle(allWords().filter(x=>x.id!==w.id&&x.pos===w.pos)).slice(0,2),opts=shuffle([w,...others]);
  runAR(false);ov.className="over cam";ov.hidden=false;
  ov.innerHTML=`<canvas id="ring" width="640" height="640"></canvas><div id="catchTop" ${w.word.length>9?'style="font-size:clamp(20px,5.6vw,28px)"':""}>${esc(w.word)}</div><div id="catchSub">${POS[w.pos].name} · ${"★".repeat(w.rare)} · ${w.pos==="n"?"이 낱말의 뜻은 무엇일까요?":w.pos==="a"?"소설에서 이것은 무엇일까요?":"이 구절은 어떤 대목일까요?"}</div><div class="opts" id="catchOpts">${opts.map(o=>`<button type="button" data-id="${o.id}">${esc(o.mean)}</button>`).join("")}</div>`;
  const rc=$("#ring").getContext("2d");let phase="quiz",tries=1,ringR=1.7,dir=-1,alive=true,last=performance.now();
  const speed=(w.rare===3?1.5:w.rare===2?1.15:.85)*(reduced?.55:1);
  const draw=now=>{
    if(!alive)return;
    const dt=Math.min(.05,(now-last)/1000);last=now;
    rc.clearRect(0,0,640,640);
    beast(rc,320,330,130,w,now/1000,{plain:true,bloom:!!S.bloom[w.id]});
    if(phase==="throw"){
      ringR+=dir*speed*dt;if(ringR<.75){ringR=.75;dir=1}if(ringR>1.75){ringR=1.75;dir=-1}
      rc.lineWidth=26;rc.strokeStyle="rgba(127,224,187,.45)";rc.beginPath();rc.arc(320,330,130*1.2,0,7);rc.stroke();
      rc.lineWidth=9;rc.strokeStyle=Math.abs(ringR-1.2)<.17?"#7fe0bb":"#ffd23f";rc.beginPath();rc.arc(320,330,130*ringR,0,7);rc.stroke();
    }
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
  const close=()=>{alive=false;ov.hidden=true;ov.innerHTML="";mob=mob.filter(x=>x!==m);fill();tally();if(tab==="map")runAR(true)};
  $("#catchOpts").addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b||phase!=="quiz")return;
    const right=b.dataset.id===w.id;
    b.classList.add(right?"right":"wrong");
    if(!right)$(`#catchOpts [data-id="${w.id}"]`).classList.add("right");
    tries=right?3:1;phase="wait";
    $("#catchSub").textContent=right?"맞았어요! 그물 3개를 받았어요.":"정답을 확인해 두세요. 그물 1개로 도전합니다.";
    setTimeout(()=>{
      if(!alive)return;
      phase="throw";
      $("#catchOpts").innerHTML=`<button class="btn" id="throw" type="button" style="text-align:center;font-size:20px;box-shadow:3px 3px 0 var(--sun)">그물 던지기</button>`;
      $("#catchSub").textContent=`노란 고리가 초록 띠에 겹칠 때 던지세요. 남은 그물 ${tries}개`;
      $("#throw").addEventListener("click",()=>{
        if(phase!=="throw")return;
        if(Math.abs(ringR-1.2)<.17){
          phase="done";S.caught[w.id]={t:Date.now()};save();
          $("#catchTop").textContent="채집 성공!";
          $("#catchSub").textContent=w.mean;
          $("#catchOpts").innerHTML=`<div style="font-family:var(--pen);background:rgba(32,36,107,.86);padding:6px 10px;border-radius:6px">${w.pos==="n"?"":"생각거리: "}${esc(w.ex)}</div><button class="btn" id="done" type="button" style="text-align:center;box-shadow:3px 3px 0 var(--sun)">채집통에 넣기</button>`;
          $("#done").addEventListener("click",close);$("#done").focus();
        }else{
          tries--;
          if(tries>0)$("#catchSub").textContent=`빗나갔어요. 남은 그물 ${tries}개`;
          else{
            phase="done";$("#catchTop").textContent="도망쳤어요";
            $("#catchSub").textContent=`${w.word}이(가) 멀리 달아났어요. 다른 낱말이를 찾아보세요.`;
            $("#catchOpts").innerHTML=`<button class="btn" id="done" type="button" style="text-align:center;box-shadow:3px 3px 0 var(--sun)">채집으로 돌아가기</button>`;
            $("#done").addEventListener("click",close);
          }
        }
      });
    },right?650:1500);
  });
}

/* ---------- 도감 ---------- */

  $("#view-dex").innerHTML=`<div class="scroll"><section><h2>채집통</h2><p class="lead">${n===0?"아직 빈 채집통이에요. 교실에서 소설의 첫 조각을 잡아 보세요.":`${all.length}개 중 ${n}개를 잡았고, ${bl}개를 감상문에 써서 꽃 피웠어요.`} 잡은 것을 감상문에 쓰면 머리에 꽃이 핍니다.</p>

/* ---------- 감상문 ---------- */
const clean=t=>t.replace(/\s+/g," ").trim();
const linesOf=t=>Math.floor(clean(t).length/LINE);
const allText=()=>S.parts.join("\n");
let lastPart=0;
function checks(text){
  const used=usedIn(text),count=p=>used.filter(w=>w.pos===p).length,z=new Set(used.map(w=>w.zone)).size,L=S.parts.reduce((a,t)=>a+clean(t).length,0),total=Math.floor(L/LINE);
  const out=[{ok:total>=20,label:`전체 20줄 이상 (${total}줄)`}];
  PARTS.forEach((p,i)=>out.push({ok:linesOf(S.parts[i])>=p.lines,label:`${p.t} ${p.lines}줄 이상 (${linesOf(S.parts[i])}줄)`}));
  out.push({ok:count("s")>=NEED.s,label:`구절 ${NEED.s}개 이상 옮겨 쓰기 (${count("s")}개)`},{ok:count("a")>=NEED.a,label:`키워드 ${NEED.a}개 이상 쓰기 (${count("a")}개)`},{ok:count("n")>=NEED.n,label:`낱말 ${NEED.n}개 이상 쓰기 (${count("n")}개)`},{ok:z>=NEED.zones,label:`서로 다른 장면 ${NEED.zones}곳 이상 (${z}곳)`});
  return out;
}
function renderChecks(){
  const text=allText(),cs=checks(text),done=cs.every(c=>c.ok),L=S.parts.reduce((a,t)=>a+clean(t).length,0),pct=Math.min(100,Math.round(L/(20*LINE)*100));
  $("#checks").innerHTML=cs.map(c=>`<li class="${c.ok?"ok":""}">${esc(c.label)}</li>`).join("");
  $("#total").style.width=pct+"%";
  PARTS.forEach((p,i)=>{$("#m"+i).textContent=`${linesOf(S.parts[i])} / ${p.lines}줄`});
  document.querySelectorAll(".bank .chip").forEach(b=>{const w=wordById(b.dataset.id);b.classList.toggle("used",!!w&&hasWord(text,w))});
  const noName=!$("#penName").value.trim();
  $("#post").disabled=!done||noName;
  $("#postWhy").textContent=noName?"이름을 적어 주세요.":done?"":"아래 조건을 모두 채우면 저장할 수 있어요.";
}
function renderWrite(){

  if(document.activeElement&&/^part\d$/.test(document.activeElement.id))return;
  const m=CFG.mission,group=p=>all.filter(w=>w.pos===p).map(w=>`<button class="chip" type="button" data-id="${w.id}">${esc(w.word)}</button>`).join("")||`<span class="lead">아직 없어요</span>`;

  ${PARTS.map((p,i)=>`<section><div class="row" style="justify-content:space-between"><h2>${i+1}. ${esc(p.t)}</h2><span id="m${i}" class="tag"></span></div><label for="part${i}">${esc(p.q)}</label><textarea id="part${i}" class="draft" rows="${p.lines+1}"></textarea></section>`).join("")}

  PARTS.forEach((p,i)=>{const d=$("#part"+i);d.value=S.parts[i]||"";d.onfocus=()=>{lastPart=i};d.oninput=()=>{S.parts[i]=d.value;save();renderChecks()}});
  $("#penName").value=S.name||"";
  $("#penName").oninput=e=>{S.name=e.target.value;save();renderChecks()};
  $("#view-write").querySelectorAll(".bank").forEach(g=>g.onclick=e=>{
    const b=e.target.closest(".chip");if(!b)return;
    const w=wordById(b.dataset.id),d=$("#part"+lastPart),s=d.selectionStart??d.value.length,ins=(w.pos==="s"?`“${w.word}” `:w.word+" ");
    d.value=d.value.slice(0,s)+ins+d.value.slice(d.selectionEnd??s);d.focus();d.selectionStart=d.selectionEnd=s+ins.length;S.parts[lastPart]=d.value;save();
    const th=$("#think");th.hidden=false;th.textContent=w.pos==="n"?`${w.word}: ${w.mean}`:`생각거리: ${w.ex}`;renderChecks();
  });
  $("#copy").onclick=async()=>{const t=workText();try{await navigator.clipboard.writeText(t);toast("글을 복사했어요")}catch(e){toast("복사하지 못했어요. 글을 길게 눌러 복사해 주세요")}};
  $("#post").onclick=submit;
  renderChecks();
}
const workText=()=>`《달밤》 감상문 - ${S.name||"이름 없음"}\n\n${S.parts.map(t=>t.trim()).filter(Boolean).join("\n\n")}`;
function submit(){
  const text=S.parts.map(t=>t.trim()).join("\n\n"),used=usedIn(text);
  if(!checks(text).every(c=>c.ok))return;
  const sentences=text.split(/(?<=[.!?…\n])\s*/);
  used.forEach(w=>{S.bloom[w.id]=(sentences.find(p=>hasWord(p,w))||text).slice(0,140)});
  S.works.push({id:"p"+Date.now().toString(36),t:Date.now(),name:S.name.trim(),mission:"《달밤》 감상문",text,words:used.map(w=>w.word)});
  S.parts=["","","",""];save();
  toast("저장했어요. 쓴 조각에 꽃이 피었어요!");
  location.hash="wall";
}

/* ---------- 우리 반 벽 ---------- */
function workHTML(w){
  let html=esc(w.text);
  (w.words||[]).slice().sort((a,b)=>b.length-a.length).forEach(word=>{
    const def=allWords().find(x=>x.word===word);
    (def?stems(def):[word]).forEach(s=>{html=html.split(esc(s)).join(`<mark>${esc(s)}</mark>`)});
  });
  html=html.replace(/<mark>(<mark>)+/g,"<mark>").replace(/(<\/mark>)+/g,"</mark>");
  return `<article class="work"><h3 style="font-size:18px">${esc(w.mission||"글")}</h3><p>${html}</p><footer><span>${esc(w.name||"익명 채집가")} · 낱말 ${(w.words||[]).length}개</span><button class="chip" type="button" data-copy="${esc(w.id)}">복사</button></footer></article>`;
}
function renderWall(){
  const all=allWords(),got=all.filter(w=>S.caught[w.id]).length,pct=Math.round(got/all.length*100),list=S.works.slice().reverse();
  $("#view-wall").innerHTML=`<div class="scroll"><section><h2>내 감상문</h2><p class="lead">${all.length}개 중 ${got}개를 채집했어요.</p><div class="meter" role="img" aria-label="채집 진행률 ${pct}%"><i style="width:${pct}%"></i></div><p class="note">감상문은 이 기기에 저장됩니다. ‘복사’를 눌러 학급 게시판에 붙여 주세요.</p></section>
  ${list.length?list.map(w=>workHTML(w)).join(""):`<p class="note">아직 저장한 감상문이 없어요.</p>`}</div>`;
  $("#view-wall").onclick=async e=>{const b=e.target.closest("[data-copy]");if(!b)return;const w=S.works.find(x=>x.id===b.dataset.copy),t=`[${w.mission}] ${w.name}\n\n${w.text}`;try{await navigator.clipboard.writeText(t);toast("글을 복사했어요")}catch(err){toast("복사하지 못했어요. 글을 길게 눌러 복사해 주세요")}};
}

/* ---------- 틀 ---------- */
let tab="map",teacherSeen=location.hash==="#teacher";

function tally(){const c=$("#count");if(c)c.textContent=`이번에 ${mob.length}마리`;const n=allWords().filter(w=>S.caught[w.id]).length;$("#tally").innerHTML=`채집 <b>${n}</b> / ${allWords().length}`}

  const h=location.hash.slice(1),views=["map","dex","write","wall","teacher"];
  tab=views.includes(h)?h:"map";
  views.forEach(v=>{$("#view-"+v).hidden=v!==tab});
  buildTabs();
  if(tab==="map"){if(!started){if(ov.hidden)intro()}else{camOn().then(ok=>{camOK=ok});runAR(ov.hidden)}}
  else{runAR(false);camOff()}
  if(tab==="dex")renderDex();if(tab==="write")renderWrite();if(tab==="wall")renderWall();if(tab==="teacher")renderTeacher();
}
addEventListener("hashchange",go);
let toastT=0;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
const boot=()=>{tally();go()};
requestAnimationFrame(boot);
</script>
